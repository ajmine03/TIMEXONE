name: Debian Package Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev binutils

      - name: Build Debian Package
        run: |
          bash packaging/build_deb.sh

      - name: Verify Package Contents & Metadata
        run: |
          ls -la packaging/dist/*.deb
          dpkg-deb --info packaging/dist/*.deb
          dpkg-deb --contents packaging/dist/*.deb
