<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="tomatoGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="55%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </radialGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ef4444" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Tomato Body -->
  <g filter="url(#glow)">
    <path d="M 32 18 C 21 18 10 24 10 38 C 10 50 20 58 32 58 C 44 58 54 50 54 38 C 54 24 43 18 32 18 Z" fill="url(#tomatoGrad)"/>
    <!-- Subtle 3D lobed shape overlay -->
    <path d="M 23 20 C 14 23 11 31 11 39 C 11 48 18 56 28 57 C 24 53 22 46 22 38 C 22 30 24 24 26 21 Z" fill="#ffffff" opacity="0.08"/>
    <!-- Highlight shine -->
    <ellipse cx="23" cy="27" rx="5" ry="3" fill="#ffffff" opacity="0.25" transform="rotate(-25 23 27)"/>
  </g>

  <!-- Stem & Leaves (Calyx) -->
  <g fill="url(#leafGrad)">
    <!-- Central stem -->
    <path d="M 32 18 C 32 12 30 7 35 6 C 35 10 33 14 33 18 Z" fill="#15803d"/>
    <!-- Leaves -->
    <path d="M 32 18 Q 25 14 19 16 Q 25 19 32 20 Z"/>
    <path d="M 32 18 Q 39 14 45 16 Q 39 19 32 20 Z"/>
    <path d="M 32 18 Q 32 24 32 26 Q 34 22 32 18 Z"/>
    <path d="M 32 18 Q 23 21 21 25 Q 26 22 32 19 Z"/>
    <path d="M 32 18 Q 41 21 43 25 Q 38 22 32 19 Z"/>
  </g>
</svg>
